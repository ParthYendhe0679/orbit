services:
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    image: mochatrade-backend:latest
    container_name: mochatrade_backend
    ports:
      - "8000:8000"
    volumes:
      - ./frontend:/app/frontend:ro
    environment:
      - PORT=8000
      - AI_SERVICE_URL=http://ai-service:8001
      - FRONTEND_PATH=/app/frontend
    depends_on:
      - ai-service
    restart: unless-stopped

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    image: mochatrade-ai-service:latest
    container_name: mochatrade_ai_service
    expose:
      - "8001"
    volumes:
      # Bind mount for development and legacy SQLite persistence
      - ./ai-service:/app
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - STREAM_HUB_URL=http://orbit-stream:8001/publish
    depends_on:
      - orbit-stream
    restart: unless-stopped

  orbit-stream:
    build:
      context: ./go-stream
      dockerfile: Dockerfile
    image: orbit-stream:latest
    container_name: orbit_stream_hub
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
    restart: unless-stopped
