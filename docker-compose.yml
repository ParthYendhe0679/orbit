services:
  trading-terminal:
    build:
      context: .
      dockerfile: Dockerfile
    image: aether-trading-terminal:latest
    container_name: aether_trading_terminal
    ports:
      - "8000:8000"
    volumes:
      # Bind mounts allow real-time code changes and SQLite database persistence
      - ./backend:/app/backend
      - ./frontend:/app/frontend
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - STREAM_HUB_URL=http://orbit-stream:8001/publish
    depends_on:
      - orbit-stream
    restart: unless-stopped

  orbit-stream:
    build:
      context: ./go-stream
      dockerfile: Dockerfile
    image: orbit-stream:latest
    container_name: orbit_stream_hub
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
    restart: unless-stopped
